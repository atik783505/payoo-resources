<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/daisyui@5" rel="stylesheet" type="text/css" />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@100..900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
        integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw=="
        crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link rel="shortcut icon" href="./assets/logo.png" type="image/x-icon">
    <title>Document</title>
    <style>
        * {
            font-family: "Outfit", sans-serif;
        }
    </style>
</head>

<body class="min-h-screen max-w-md bg-base-200 mx-auto">
    <header
        class="w-11/12 mx-auto border-b-2 py-3 bg-base-200 sticky top-0  border-gray-300 flex justify-between items-center">
        <div class="flex gap-1">
            <img src="./assets/logo.png" alt="" class="w-[60px]">
            <div>

                <h2 class="text-neutral font-bold">$<span id="amount">45000</span></h2>
                <p class="text-neutral/50">Available Balance</p>
            </div>
        </div>
        <div>
            <a href="index.html" class="btn btn-soft"><i class="fa-solid fa-arrow-right-from-bracket"></i> Log Out</a>
        </div>
    </header>
    <section class="w-11/12 mx-auto py-5">
        <h2 class="text-[24px] font-bold">Welcome to Pay<span class="text-primary">oo</span></h2>
        <p class="text-neutral/50">Enjoy easy and convenient financial services with us. Cashout charge is low and </p>
        <div class="py-5 grid grid-cols-3 gap-3">
            <button onclick="showAll('add-money')" class="btn btn-primary btn-soft flex flex-col h-full p-3 w-[120px]">
                <img src="./assets/opt-1.png" alt="">
                <p>Add Money</p>
            </button>
            <button onclick="showAll('cash-out')" class="btn btn-primary btn-soft flex flex-col h-full p-3 w-[120px]">
                <img src="./assets/opt-2.png" alt="">
                <p>Cashout</p>
            </button>
            <button onclick="showAll('transfer-money')"
                class="btn btn-primary btn-soft flex flex-col h-full p-2 w-[120px]">
                <img src="./assets/opt-3.png" alt="">
                <p>Transfer Money</p>
            </button>
            <button onclick="showAll('bonus')" class="btn btn-primary btn-soft flex flex-col h-full p-3 w-[120px]">
                <img src="./assets/opt-4.png" alt="">
                <p>Get Bonus</p>
            </button>
            <button onclick="showAll('pay-bill')" class="btn btn-primary btn-soft flex flex-col h-full p-3 w-[120px]">
                <img src="./assets/opt-5.png" alt="">
                <p>Pay Bill</p>
            </button>
            <button onclick="showAll('history')" class="btn btn-primary btn-soft flex flex-col h-full p-3 w-[120px]">
                <img src="./assets/opt-6.png" alt="">
                <p>Transactions</p>
            </button>
        </div>
    </section>
    <section id="add-money" class="w-11/12 mx-auto hidden">
        <h2 class="font-bold mb-3">Add Money</h2>
        <div class="card bg-base-100 w-full  shadow  rounded-md">
            <div class="card-body">
                <fieldset class="fieldset">
                    <label class="label text-neutral font-bold">Select A Bank</label>
                    <select id="bank" class="select rounded-full w-full bg-base-200 border-none">
                        <option disabled selected>Select back</option>
                        <option>DBBL</option>
                        <option>JB</option>
                        <option>SSL</option>
                    </select>
                    <label class="label text-neutral font-bold">Bank Account Number</label>
                    <input id="addmoney-num" type="text" minlength="11" maxlength="11"
                        class="input rounded-full w-full bg-base-200 border-none"
                        placeholder="Enter 11 digit account number" />
                    <br>
                    <label class="label text-neutral font-bold">Amount to Add</label>
                    <input id="addmoney-amount" type="number" minlength="11" maxlength="11"
                        class="input rounded-full w-full bg-base-200 border-none"
                        placeholder="Add Amount to addmoney" />
                    <br>
                    <label class="label text-neutral font-bold">Pin Number</label>
                    <input id="addmoney-pin" type="password" class="input rounded-full bg-base-200 border-none w-full"
                        placeholder="Enter 4 Digit Pin" />
                    <button id="addmoney-btn" class="btn btn-primary mt-4 rounded-full">Add Money</button>
                </fieldset>
            </div>
        </div>
    </section>
    <section id="cash-out" class="w-11/12 mx-auto hidden">
        <h2 class="font-bold mb-3">Cash Out</h2>
        <div class="card bg-base-100 w-full  shadow  rounded-md">
            <div class="card-body">
                <fieldset class="fieldset">
                    <label class="label text-neutral font-bold">Agent Number</label>
                    <input id="cashout-num" type="text" minlength="11" maxlength="11"
                        class="input rounded-full w-full bg-base-200 border-none" placeholder="Enter 11 digit number" />
                    <br>
                    <label class="label text-neutral font-bold">Amount</label>
                    <input id="cashout-amount" type="number" minlength="11" maxlength="11"
                        class="input rounded-full w-full bg-base-200 border-none"
                        placeholder="Enter amount to withdraw" />
                    <br>
                    <label class="label text-neutral font-bold">Pin Number</label>
                    <input id="cashout-pin" type="password" class="input rounded-full bg-base-200 border-none w-full"
                        placeholder="Enter 4 Digit Pin" />
                    <button id="withdraw-btn" class="btn btn-primary mt-4 rounded-full">Withdraw Money</button>
                </fieldset>
            </div>
        </div>
    </section>
    <section id="transfer-money" class="w-11/12 mx-auto hidden">
        <h2 class="font-bold mb-3">Transfer Money</h2>
        <div class="card bg-base-100 w-full  shadow  rounded-md">
            <div class="card-body">
                <fieldset class="fieldset">
                    <label class="label text-neutral font-bold">User Account Number</label>
                    <input id="transfer-num" type="text" minlength="11" maxlength="11"
                        class="input rounded-full w-full bg-base-200 border-none" placeholder="Enter 11 digit number" />
                    <br>
                    <label class="label text-neutral font-bold">Amount</label>
                    <input id="transfer-amount" type="number" minlength="11" maxlength="11"
                        class="input rounded-full w-full bg-base-200 border-none"
                        placeholder="Enter amount to transfer" />
                    <br>
                    <label class="label text-neutral font-bold">Pin Number</label>
                    <input id="transfer-pin" type="password" class="input rounded-full bg-base-200 border-none w-full"
                        placeholder="Enter 4 Digit Pin" />
                    <button id="send-btn" class="btn btn-primary mt-4 rounded-full">Send Now</button>
                </fieldset>
            </div>
        </div>
    </section>
    <section id="bonus" class="w-11/12 mx-auto hidden">
        <h2 class="font-bold mb-3">Get Bonus</h2>
        <div class="card bg-base-100 w-full  shadow  rounded-md">
            <div class="card-body">
                <fieldset class="fieldset">
                    <label class="label text-neutral font-bold">Enter Bonus Coupon</label>
                    <input id="coupon-code" type="text" class="input rounded-full bg-base-200 border-none w-full"
                        placeholder="Enter your coupon" />
                    <button id="bonus-btn" class="btn btn-primary mt-4 rounded-full">Get Bonus</button>
                </fieldset>
            </div>
        </div>
    </section>
    <section id="pay-bill" class="w-11/12 mx-auto hidden">
        <h2 class="font-bold mb-3">Pay Bill</h2>
        <div class="card bg-base-100 w-full  shadow  rounded-md">
            <div class="card-body">
                <fieldset class="fieldset">
                    <label class="label text-neutral font-bold">Select To Pay</label>
                    <select id="pay-method" class="select rounded-full w-full bg-base-200 border-none">
                        <option disabled selected>Select back</option>
                        <option>Bank</option>
                        <option>MFS</option>
                        <option>NSPB</option>
                    </select>
                    <br>
                    <label class="label text-neutral font-bold">Biller Account Number</label>
                    <input id="biller-num" type="text" minlength="11" maxlength="11"
                        class="input rounded-full w-full bg-base-200 border-none"
                        placeholder="Enter account number" />
                    <br>
                    <label class="label text-neutral font-bold">Amount to Pay</label>
                    <input id="pay-amount" type="number" minlength="11" maxlength="11"
                        class="input rounded-full w-full bg-base-200 border-none"
                        placeholder="Add Amount to pay" />
                    <br>
                    <label class="label text-neutral font-bold">Pin Number</label>
                    <input id="pay-pin" type="password" class="input rounded-full bg-base-200 border-none w-full"
                        placeholder="Enter 4 Digit Pin" />
                    <button id="pay-btn" class="btn btn-primary mt-4 rounded-full">Pay Now</button>
                </fieldset>
            </div>
        </div>
    </section>
    <section id="history" class="w-11/12 mx-auto">
        <h2 class="font-bold mb-3">Transaction History</h2>
        <div id="history-container" class="flex flex-col gap-4 pb-[120px]">
         
        </div>
    </section>
    <script src="js/machine.js"></script>
    <script src="js/addmoney.js"></script>
    <script src="js/cashout.js"></script>
    <script src="js/sendmoney.js"></script>
    <script src="js/pay.js"></script>
    <script src="js/bonus.js"></script>
</body>

</html>
